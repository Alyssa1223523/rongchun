<title>融椿</title>
<style>
:root{
  --bg:#fdf1f4; --panel:#ffffff; --panel2:#fceaf0; --line:#f7dbe4;
  --text:#5c3a45; --sub:#c99aab; --accent:#f291ac; --accent2:#ffffff;
  --bubble-me:linear-gradient(135deg,#f7a8bf,#f291ac); --bubble-me-t:#ffffff;
  --bubble-other:#ffffff; --bubble-other-t:#6b4552;
  --shadow:0 8px 30px rgba(242,145,172,.22); --radius:18px;
}
[data-theme="dark"]{
  --bg:#251c20; --panel:#2f2429; --panel2:#3d2f35; --line:#4e3d44;
  --text:#f6e4ea; --sub:#b08e9a; --accent:#f291ac; --accent2:#2c2126;
  --bubble-me:linear-gradient(135deg,#f7a8bf,#ee8aa9); --bubble-me-t:#3a242d;
  --bubble-other:#3d2f35; --bubble-other-t:#f6e4ea;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none; user-select:none; -webkit-user-select:none}
input,textarea{user-select:text; -webkit-user-select:text}
html,body{height:100%}
body{
  background:#f6dfe7; font-family:"Songti SC","STSong","SimSun",serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.phone{
  width:min(430px,100vw); height:min(920px,100dvh); background:var(--bg);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  transition:background .35s,color .35s;
}
@media(min-width:500px) and (min-height:960px){
  .phone{border-radius:44px; box-shadow:var(--shadow); border:10px solid #4a333c; height:min(880px,94vh)}
}
/* iOS：输入框字号≥16px 防止聚焦时自动缩放页面 */
@media(max-width:499px){
  input,textarea,select{font-size:16px!important}
}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 开场动画 ---------- */
#intro{position:absolute; inset:0; z-index:100; background:#2c2126; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:26px;
  transition:opacity .7s ease;}
#intro.gone{opacity:0; pointer-events:none}
#intro svg circle{stroke-dasharray:320; stroke-dashoffset:320; animation:draw 1.6s ease forwards}
#intro svg path{stroke-dasharray:80; stroke-dashoffset:80; animation:draw 1.2s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .t{color:#fceaf0; font-size:22px; letter-spacing:.5em; text-indent:.5em; opacity:0; animation:fadeup 1s 1.4s forwards}
#intro .s{color:#c99aab; font-size:11px; letter-spacing:.4em; text-indent:.4em; opacity:0; animation:fadeup 1s 1.9s forwards}
@keyframes fadeup{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* ---------- 主屏 ---------- */
#home{flex:1; display:flex; flex-direction:column; padding:56px 22px 30px;
  background:
   radial-gradient(1200px 500px at 20% -10%, rgba(247,168,191,.30), transparent 60%),
   radial-gradient(900px 500px at 110% 110%, rgba(242,145,172,.22), transparent 60%),
   var(--bg);
  transition:background .35s;}
.clock{margin:0 auto 8px; text-align:center}
.clock .h{font-size:56px; font-weight:600; letter-spacing:2px; color:var(--text)}
.clock .d{font-size:13px; color:var(--sub); letter-spacing:3px; margin-top:2px}
.love-card{margin:22px auto 0; width:86%; background:var(--panel); border:1.5px solid #f3c6d3; border-radius:30px;
  padding:26px 22px 20px; text-align:center; box-shadow:0 12px 30px rgba(242,145,172,.18)}
.lc-row{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:14px}
.lc-p{display:flex; flex-direction:column; align-items:center; gap:9px}
.lc-p .avatar{width:74px; height:74px; font-size:30px; border:3px solid #f9d3de;
  box-shadow:0 5px 14px rgba(242,145,172,.28)}
.lc-p span{font-size:12px; letter-spacing:3px; color:var(--sub)}
.heart-pulse{animation:hp 1.6s ease-in-out infinite; filter:drop-shadow(0 3px 6px rgba(226,96,138,.35))}
@keyframes hp{0%,100%{transform:scale(1)}12%{transform:scale(1.28)}24%{transform:scale(1)}}
.lc-line{height:1px; margin:2px 6px 14px;
  background:linear-gradient(90deg,transparent,#f3c6d3 30%,#f3c6d3 70%,transparent)}
.lc-days{font-size:15px; letter-spacing:4px; color:var(--text)}
.lc-days b{font-size:34px; font-weight:600; letter-spacing:1px; margin:0 5px; color:#e2608a}
.lc-sub{font-size:10.5px; color:var(--sub); letter-spacing:2px; margin-top:7px}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px 12px; margin-top:34px}
.appbtn{display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
  user-select:none; transition:transform .15s}
.appbtn:active{transform:scale(.9)}
.appbtn .ic{width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,var(--panel),var(--panel2)); border:1px solid var(--line);
  box-shadow:0 3px 10px rgba(0,0,0,.08); color:var(--text); transition:.35s}
.appbtn span{font-size:12px; color:var(--text); letter-spacing:2px}
.dots{display:flex; gap:8px; justify-content:center; margin-top:auto; padding-top:20px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--sub); opacity:.5}

/* ---------- APP 容器 ---------- */
.screen{position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:20; transform:translateY(24px); opacity:0; transition:.28s cubic-bezier(.2,.8,.2,1)}
.screen.open{display:flex}
.screen.show{transform:none; opacity:1}
.shead{display:flex; align-items:center; gap:12px; padding:16px 16px 12px; border-bottom:1px solid var(--line); background:var(--panel)}
.shead .back{width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--panel2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex:none}
.shead .back:active{transform:scale(.92)}
.shead h2{font-size:16px; font-weight:600; letter-spacing:3px; color:var(--text); flex:1}
.sbody{flex:1; overflow-y:auto; padding:16px}

/* ---------- 信箱 ---------- */
.appbtn{position:relative}
.bdg{position:absolute; top:-4px; right:4px; min-width:17px; height:17px; border-radius:9px; background:#e2608a;

.letter-row{display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line);

<script>
/* ================= 数据 ================= */
const DEF = {
  profile:{ meName:'我', meAvatar:'', otherName:'对方', otherAvatar:'',
    meHomeAvatar:'', otherHomeAvatar:'' },
  stickers:{ me:[], other:[] },
  letters:[], pendingLetter:null,
  weibo:{ feed:[], hot:[], gen:0 },
  settings:{
    name:'对方', delayMin:2, delayMax:8, autoReply:false, proactive:false, proMin:1, proMax:5,
    readNoReply:false, rnrProb:30, quote:true, combine:true, notify:false,
    voiceReply:true, voiceProb:30,
    sound:true, soundRandom:true, sound:'清脆',
    group:false, members:[{name:'阿灰'},{name:'小白'},{name:'阿墨'}],
    typingText:'对方正在输入',
    showName:true, showAvatar:true, showTs:true, showRead:true, startDate:'2026-11-26',
    ttsKey:'', ttsGroup:'', ttsVoice:'male-qn-qingse', ttsVoiceCustom:'',
    theme:'system', fontSize:15, fontFam:'', fontUrl:'', bubbleCSS:'',
    chatBg:'', intro:true
  },
  cards:{ '默认': [] },   // {默认:[{id,text,shield,ts}]}
  groupshield:{}, msgs:[]
};
let S = load();
function load(){
  try{ const raw = localStorage.getItem('simtalk_v1'); if(raw){ const d = JSON.parse(raw);
    return { profile:Object.assign({},DEF.profile,d.profile), stickers:Object.assign({},DEF.stickers,d.stickers),
      letters:d.letters||[], pendingLetter:d.pendingLetter||null,
      weibo:d.weibo||{ feed:[], hot:[], gen:0 },
      settings:Object.assign({},DEF.settings,d.settings),
      cards:d.cards||DEF.cards, groupshield:d.groupshield||{}, msgs:d.msgs||[] }; } }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
/* ---------- 存储：IndexedDB 主仓库（容量大），localStorage 兜底 ---------- */
let idb=null, saveDeb=null;
function idbOpen(){ return new Promise((res,rej)=>{
  const r=indexedDB.open('rongchun',1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbSet(v){ return new Promise((res,rej)=>{ if(!idb) return rej();
  const tx=idb.transaction('kv','readwrite');
  tx.objectStore('kv').put(v,'s'); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbGet(){ return new Promise(res=>{ if(!idb) return res(null);
  try{ const rq=idb.transaction('kv').objectStore('kv').get('s');
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }catch(e){ res(null); } }); }

/* 每次保存：同步写 localStorage 日志（保底）+ 延迟写 IndexedDB（主仓库），按时间戳取新 */
function save(){ S.savedAt=Date.now(); journal(); clearTimeout(saveDeb); saveDeb=setTimeout(flushIDB,250); }
function journal(){ try{ localStorage.setItem('simtalk_j', JSON.stringify(S)); }
  catch(e){ try{ localStorage.removeItem('simtalk_v1');   // 清旧版遗留腾空间
    localStorage.setItem('simtalk_j', JSON.stringify(S)); }catch(e2){} } }
function flushIDB(){ if(idb) idbSet(JSON.stringify(S)).catch(()=>{}); }
function flushAll(){ clearTimeout(saveDeb); flushIDB(); journal(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAll(); });
window.addEventListener('pagehide',flushAll);
function legacySave(){ try{ localStorage.setItem('simtalk_j', JSON.stringify(S)); }catch(e){ slimAndRetry(); } }
function slimAndRetry(){
  const bg=S.settings.chatBg; S.settings.chatBg=''; applyChatBg();
  try{ localStorage.setItem('simtalk_v1', JSON.stringify(S)); toast('存储已满：已自动移除聊天背景图'); return; }catch(e){}
  S.msgs.forEach(m=>{ if(m.audio) m.audio=''; });
  try{ localStorage.setItem('simtalk_v1', JSON.stringify(S)); toast('存储已满：语音已转为模拟时长'); return; }catch(e){}
  S.msgs=S.msgs.slice(-200);
  try{ localStorage.setItem('simtalk_v1', JSON.stringify(S)); toast('存储已满：仅保留最近200条消息'); return; }catch(e){}
  if(bg) { S.settings.chatBg=bg; } toast('存储空间不足：请先在设置里全量导出备份，再考虑重置'); }
const $ = s=>document.querySelector(s), $$ = s=>document.querySelectorAll(s);
const uid = ()=>Math.random().toString(36).slice(2,10);
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

/* ================= 基础 UI ================= */
let toastT;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2000); }

function openMask(html){ $('#sheet').innerHTML=html; $('#mask').classList.add('open'); }
function closeMask(){ $('#mask').classList.remove('open'); }
$('#mask').addEventListener('click', e=>{ if(e.target.id==='mask') closeMask(); });

function openScreen(id){ const el=$('#'+id); el.classList.add('open');
  // 聊天页：同帧内直接定位到底部（在首帧绘制前完成，不可见）
  if(id==='scr-chat'){ const l=document.getElementById('msg-list'); l.scrollTop=l.scrollHeight; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show'))); }
function closeScreen(id){ const el=$('#'+id); el.classList.remove('show');
  setTimeout(()=>el.classList.remove('open'),280); }
$$('[data-back]').forEach(b=>b.onclick=()=>closeScreen(b.closest('.screen').id));

const ICONS = {
  chat:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>',
  cards:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="13" height="16" rx="2"/><path d="M9 4v16M20 8v12"/></svg>',
  settings:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',
  theme:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c4 3 8.8 3 12.8 0M5.6 18.4c4-3 8.8-3 12.8 0"/></svg>',
  letters:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7.5l9 6 9-6"/></svg>',
  weibo:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.9 7.9"/></svg>',
album:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',book:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
};
const APPS=[['chat','聊天'],['cards','字卡库'],['letters','信箱'],['weibo','微博'],['album','相册'],['book','答案书'],['settings','设置'],['theme','外观']];
$('#grid').innerHTML = APPS.map(a=>
 `<div class="appbtn" data-app="scr-${a[0]}"><div class="ic">${ICONS[a[0]]}</div><span>${a[1]}</span><b class="bdg" id="bdg-${a[0]}"></b></div>`).join('');

<script>
/* ================= 音效 ================= */
let AC;
function tone(freq,dur,type,vol,slide){ try{
  AC = AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}catch(e){} }
/* ================= MiniMax TTS ================= */
const TTS_VOICES=[['male-qn-qingse','青涩青年'],['male-qn-jingying','精英青年'],['male-qn-badao','霸道青年'],
  ['male-qn-daxuesheng','大学生'],['presenter_male','男主持人'],['audiobook_male_1','磁性男声']];
let ttsMem={};
function ttsReady(){ return !!(S.settings.ttsKey && S.settings.ttsGroup); }
function curVoiceId(){ if((S.settings.ttsVoice||'')==='custom') return (S.settings.ttsVoiceCustom||'').trim();
  return S.settings.ttsVoice||'male-qn-qingse'; }
let lastTTSErr='';
async function miniTTSOnce(text, host){
  const res=await fetch(`https://${host}/v1/t2a_v2?GroupId=${encodeURIComponent(S.settings.ttsGroup)}`,{
    method:'POST',
    headers:{ 'Authorization':'Bearer '+S.settings.ttsKey, 'Content-Type':'application/json' },
    body:JSON.stringify({ model:'speech-02-hd',
      text:String(text).slice(0,300), stream:false,
      voice_setting:{ voice_id:curVoiceId(), speed:1, vol:10, pitch:0 },
      audio_setting:{ sample_rate:32000, bitrate:128000, format:'mp3', channel:1 }
    })});
  const body=await res.text();
  let j=null; try{ j=JSON.parse(body); }catch(e){}
  if(!j) throw new Error(host+' HTTP'+res.status+' 非JSON: '+body.slice(0,80));
  if(j.base_resp && j.base_resp.status_code!==0)
    throw new Error(host+' '+(j.base_resp.status_msg||('错误码'+j.base_resp.status_code)));
  const hex=j.data&&(j.data.audio||j.data.audio_file);
  if(!hex || typeof hex!=='string')
    throw new Error(host+' 结构异常: '+body.slice(0,80));
  const bytes=new Uint8Array(hex.length/2);
  for(let i=0;i<bytes.length;i++) bytes[i]=parseInt(hex.substr(i*2,2),16);
  const blob=new Blob([bytes],{type:'audio/mpeg'});
  return new Promise(r=>{ const fr=new FileReader();
    fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
}
async function miniTTS(text){
  lastTTSErr='';
  if(!ttsReady()){ lastTTSErr='未填写 Key 或 Group ID'; return null; }
  if(!curVoiceId()){ lastTTSErr='未选择音色'; return null; }
  if(ttsMem[text]) return ttsMem[text];
  const errs=[];
  for(const host of ['api.minimaxi.com','api.minimax.io']){   // 国内/国际都试
    try{ const url=await miniTTSOnce(text,host);
      ttsMem[text]=url; return url;
    }catch(e){ errs.push(e.message); }
  }
  lastTTSErr = errs.join(' ｜ ').slice(0,150);
  return null;
}

  else toast('失败：'+lastTTSErr); }

      :'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'}${esc(m.call.text)}</div></div>`;
    const mem = S.settings.group && m.mi!=null ? S.settings.members[m.mi] : null;

  });
  list.scrollTop = list.scrollHeight;
  updateHeader();
}

    ? `<img src="${m.img}" class="sticker-img">`

  if(m.voice) return `<span class="voice-body"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10"/></svg><b style="font-weight:400">${m.dur}″</b>${(m.audio&&!m.played)?'<i class="vdot"></i>':''}</span>`+(m.text?`<div class="v2t" data-id="${m.id}">转文字</div>`+(m.showText?`<div class="v2t-text">${esc(m.text)}</div>`:''):'');

/* ================= 回复引擎 ================= */
function poolCards(){ const out=[];
  for(const g in S.cards){ if(S.groupshield[g]) continue;
    for(const c of S.cards[g]) if(!c.shield) out.push(c.text); }
  return out; }
function sample(arr,n){ const a=arr.slice(),o=[]; while(n-->0&&a.length) o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); return o; }

let typingTimer=null, replyTimer=null;
function setTyping(on){ $('#typing').classList.toggle('on',on);
  $('#typing-text').textContent=S.settings.typingText||'对方正在输入'; }

function scheduleProactive(){
  clearTimeout(replyTimer);
  if(!S.settings.proactive || !S.settings.group && poolCards().length===0) {}
  if(!S.settings.proactive) return;
  const {proMin,proMax} = S.settings;
  const wait = rnd(Math.min(proMin,proMax), Math.max(proMin,proMax))*60000;
  replyTimer = setTimeout(()=>{ if(document.visibilityState!=='hidden' || true) incomingFlow(true); scheduleProactive(); }, wait);
}

function incomingFlow(isProactive){
  const pool = poolCards();
  if(!pool.length){ if(isProactive) return; toast('字卡库为空，先去字卡库添加'); return; }
  const st = S.settings;
  // 主动消息偶尔也会"已读不回"式沉默？主动消息必发；被触发才走已读不回
  if(!isProactive && st.readNoReply && Math.random()*100 < st.rnrProb){
    const lastMe=[...S.msgs].reverse().find(m=>m.who==='me');
    if(lastMe){ lastMe.read=true; save(); renderMsgs(); toast('对方已读，没有回复'); }
    return;
  }
  setTyping(true);
  const delay = rnd(Math.min(st.delayMin,st.delayMax), Math.max(st.delayMin,st.delayMax))*1000;
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=>{
    setTyping(false);
    // 甩表情包：他有表情包库存时 25% 概率发图
    if(S.stickers.other.length && Math.random()<0.25){ pushImg(pick(S.stickers.other),'other',true); return; }
    // 语音回复：开启后按概率用语音消息回你（配了 MiniMax 则真声合成）
    if(st.voiceReply && Math.random()*100 < st.voiceProb){
      const pool=poolCards(); const text=pool.length?pick(pool):null;
      (async()=>{ let audio='', dur=2+Math.floor(Math.random()*9);
        if(text && ttsReady()){ const u=await miniTTS(text);
          if(u){ audio=u; dur=Math.max(1,Math.round(text.length/4)); } }
        pushOther('', null, dur, true, text, audio); })();
      return; }
    let n = 1+Math.floor(Math.random()*Math.min(3,pool.length));
    let texts = sample(pool,n);
    let msg;
    if(st.combine && texts.length>1 && Math.random()<.5){
      const seps=['。','，',' ','～','…'];
      msg = texts.join(pick(seps));
    } else {
      // 连句关闭时逐条发，间隔一小段
      texts.forEach((t,i)=>setTimeout(()=>pushOther(t,null), i*rnd(700,1400)));
      return;
    }
    // 引用回复
    let quote=null;
    if(st.quote){ const mine=S.msgs.filter(m=>m.who==='me').slice(-10);
      if(mine.length && Math.random()<.35) quote=pick(mine).text; }
    pushOther(msg,quote);
  }, delay);
}
function pushOther(text,quote,dur,isVoice,voiceText,audio){
  const m={id:uid(), who:'other', text, ts:Date.now(),
    mi: S.settings.group? Math.floor(Math.random()*S.settings.members.length) : null,
    quote: quote||null, read:false, showTs:false};
  if(isVoice){ m.voice=true; m.dur=dur; m.audio=audio||''; if(voiceText) m.text=voiceText; }
  S.msgs.push(m);
  // 已读：对方发来后，我方的消息标记已读
  S.msgs.forEach(x=>{ if(x.who==='me') x.read=true; });
  save(); renderMsgs(); playSound(); doNotify(text);
}

/* 按住说话（真实录音，失败则模拟时长） */
const rec={mr:null,chunks:[],t0:0,int:null,startY:0,cancel:false,stream:null};
$('#talk-bar').addEventListener('pointerdown',e=>{ e.preventDefault(); startRec(e); });
window.addEventListener('pointermove',e=>{ if(!$('#rec-ov').classList.contains('on')) return;
  rec.cancel = e.clientY < rec.startY-80;
  $('#rec-ov .rmic').style.background = rec.cancel?'#8a8a8a':'#e2608a'; });
window.addEventListener('pointerup',stopRec);
window.addEventListener('pointercancel',stopRec);
function micWarn(){ if(sessionStorage.getItem('mic_warn')) return;
  sessionStorage.setItem('mic_warn','1');
  toast('本地文件无法授权麦克风，托管到 https 后可录真声'); }
function startRec(e){ if(bar.mode!=='voice') return;
  rec.startY=e.clientY; rec.cancel=false; rec.chunks=[];
  try{ navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      rec.stream=st; rec.mr=new MediaRecorder(st);
      rec.mr.ondataavailable=ev=>rec.chunks.push(ev.data); rec.mr.start();
    }).catch(()=>{ rec.mr=null; micWarn(); }); }catch(err){ rec.mr=null; micWarn(); }
  rec.t0=Date.now(); $('#rec-ov').classList.add('on');
  $('#rec-ov .rmic').style.background='#e2608a';
  rec.int=setInterval(()=>{ $('#rec-time').textContent=Math.floor((Date.now()-rec.t0)/1000)+'″'; },200);
  $('#talk-bar').classList.add('holding'); }
function recCleanup(){ if(rec.stream){ rec.stream.getTracks().forEach(t=>t.stop()); rec.stream=null; } rec.mr=null; }
function stopRec(){ if(!$('#rec-ov').classList.contains('on')) return;
  clearInterval(rec.int); $('#talk-bar').classList.remove('holding');
  const dur=Math.max(1,Math.round((Date.now()-rec.t0)/1000));
  const cancelled=rec.cancel; rec.cancel=false;
  $('#rec-ov').classList.remove('on');
  if(cancelled){ if(rec.mr){ rec.mr.onstop=recCleanup; rec.mr.stop(); } else recCleanup(); return; }
  if(dur<1){ recCleanup(); toast('说话时间太短'); return; }
  if(rec.mr){ rec.mr.onstop=()=>{ try{
      const blob=new Blob(rec.chunks,{type:rec.mr.mimeType||'audio/webm'});
      const r=new FileReader(); r.onload=()=>{ pushMsg({voice:true,dur,audio:r.result}); }; r.readAsDataURL(blob);
    }catch(e){ pushMsg({voice:true,dur,audio:''}); } recCleanup(); };
    rec.mr.stop();
  } else { pushMsg({voice:true,dur,audio:''}); recCleanup(); } }
</script>

<script>
/* ================= 模拟通话 ================= */
const call = { type:null, answered:false, ansT:null, endT:null, ringI:null, tickI:null, sec:0, cam:null, flipped:false };
function ringOnce(){ tone(450,.9,'sine',.07); }
function startCall(type){
  call.on=true; call.type=type; call.answered=false; call.sec=0; call.incoming=false; call.rejected=false; call.missed=false;
  $('#cb-ans').style.display='none';
  $('#cb-mute').style.display='flex'; $('#cb-spk').style.display='flex';
  const ui=$('#callui');
  $('#call-name').textContent = S.profile.otherName;
  $('#call-av').innerHTML = avatarHTML(S.profile.otherName,0,S.profile.otherAvatar);
  $('#call-stat').textContent = type==='video'?'视频通话 · 正在呼叫…':'正在呼叫…';
  ui.classList.add('on','calling');
  $('#cb-spk').style.display = type==='video'?'none':'flex';
  $('#cb-mute').classList.remove('off'); $('#cb-spk').classList.remove('off');
  ringOnce(); call.ringI=setInterval(ringOnce, 4000);
  if(type==='video') startCam();
  // 12% 概率无应答，其余 3~9 秒接听
  if(Math.random()<0.12){
    call.endT=setTimeout(()=>endCall('对方无应答'), rnd(12000,16000));
  } else {
    call.ansT=setTimeout(answerCall, rnd(3000,9000));
  }
}
function answerCall(){
  call.answered=true;
  clearInterval(call.ringI); clearTimeout(call.endT);
  $('#callui').classList.remove('calling');
  tone(660,.12,'sine',.1); setTimeout(()=>tone(880,.18,'sine',.1),130);
  call.tickI=setInterval(()=>{ call.sec++;
    $('#call-stat').textContent = fmtMM(call.sec) + (call.type==='video'?' · 视频通话':'');
  },1000);
  $('#call-stat').textContent='00:00' + (call.type==='video'?' · 视频通话':'');
}
function fmtMM(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function endCall(msg){
  clearInterval(call.ringI); clearInterval(call.tickI); clearInterval(call.ringT);
  clearTimeout(call.ansT); clearTimeout(call.endT); clearTimeout(call.noAnsT); clearTimeout(call.autoEndT);
  call.on=false; call.missed=false;
  if(call.cam){ call.cam.getTracks().forEach(t=>t.stop()); call.cam=null; }
  const sec=call.sec, answered=call.answered, ctype=call.type||'audio', incoming=!!call.incoming, rejected=!!call.rejected;
  $('#callui').classList.remove('on','calling');
  $('#call-me').style.display='none';
  $('#cb-ans').style.display='none';
  let rec, tTxt;
  if(answered){ rec='通话时长 '+fmtMM(sec); tTxt='通话结束'; }
  else if(incoming){ rec=rejected?'已拒绝':'未接听'; tTxt=rejected?'已拒绝':'对方已取消'; }
  else if(msg==='对方无应答'){ rec='对方无应答'; tTxt=msg; }
  else { rec='已取消'; tTxt='已取消'; }
  S.msgs.push({id:uid(), who:incoming&&answered?'other':'me', ts:Date.now(), read:true, showTs:false, call:{type:ctype, text:rec}});
  save(); renderMsgs(); playSound();
  toast(tTxt + (answered?' · 时长 '+fmtMM(sec):''));
  call.answered=false; call.incoming=false; call.rejected=false; call.sec=0; call.type=null;
}
async function startCam(){
  try{
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    call.cam=st; const v=$('#call-me'); v.srcObject=st; await v.play();
    v.style.display='block'; v.style.transform=call.flipped?'scaleX(-1)':'none';
  }catch(e){ /* 无摄像头权限则只显示对方头像 */ }
}
$('#cb-hang').onclick=()=>endCall();
$('#cb-mute').onclick=e=>e.currentTarget.classList.toggle('off');
$('#cb-spk').onclick=e=>e.currentTarget.classList.toggle('off');

/* ================= 表情包 ================= */
let stickerTab='me';
function openStickers(){ const p=$('#panel'); p.dataset.k='stk'; p.classList.add('on'); renderStickers(); }
function renderStickers(){ const p=$('#panel');
  p.innerHTML=`<div class="stk-tabs">
      <div class="chip ${stickerTab==='me'?'on':''}" data-tab="me">${esc(S.profile.meName)}的</div>
      <div class="chip ${stickerTab==='other'?'on':''}" data-tab="other">${esc(S.profile.otherName)}的</div></div>
    <div class="stk-grid"><div class="stk-add">＋</div>
      ${S.stickers[stickerTab].map((s,i)=>`<img src="${s}" data-i="${i}">`).join('')}</div>
    <div class="hint" style="margin-top:12px">点图发送 · 长按删除 · 对方回复时也会随机发“${esc(S.profile.otherName)}的”表情包</div>`;
  $$('#panel .stk-tabs .chip').forEach(c=>c.onclick=()=>{ stickerTab=c.dataset.tab; renderStickers(); });
  $('#panel .stk-add').onclick=pickStickers;
  $$('#panel .stk-grid img').forEach(img=>{
    img.onclick=()=>{ pushImg(S.stickers[stickerTab][+img.dataset.i], stickerTab==='me'?'me':'other', true); hidePanel(); };
    let lp=null;
    img.addEventListener('pointerdown',()=>{ lp=setTimeout(()=>{ lp='fired';
      openMask(`<h3>删除这张表情包 <span class="x" onclick="closeMask()">✕</span></h3>
        <div class="hint">从「${esc(stickerTab==='me'?S.profile.meName:S.profile.otherName)}的」表情包库中移除</div>
        <div class="sline"><button class="mini-btn" style="width:100%;border-color:#a33;color:#a33" onclick="delSticker(${img.dataset.i})">确认删除</button></div>`);
    },500); });
    img.addEventListener('pointerup',()=>{ if(lp&&lp!=='fired') clearTimeout(lp); lp=null; });
    img.addEventListener('pointerleave',()=>{ if(lp&&lp!=='fired') clearTimeout(lp); lp=null; });
  });
}
function delSticker(i){ S.stickers[stickerTab].splice(i,1); save(); closeMask(); renderStickers(); }
function pickStickers(){
  let inp=document.getElementById('stk-file');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='stk-file'; inp.accept='image/*'; inp.multiple=true; inp.style.display='none';
    inp.onchange=async ev=>{ let n=0;
      for(const f of ev.target.files){ try{ const d=await fileToSticker(f); S.stickers[stickerTab].push(d); n++; }catch(e){} }
      save(); renderStickers(); toast(`已添加 ${n} 张表情包`); };
    document.body.appendChild(inp); }
  inp.click(); }
function fileToSticker(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas');
      const s=Math.min(1, 320/Math.max(img.width,img.height));
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/png')); };
    img.onerror=rej; img.src=r.result; };
  r.onerror=rej; r.readAsDataURL(file); }); }
function compressImage(dataURL, maxSize, mime, quality){ return new Promise(res=>{
  const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas');
    const s=Math.min(1, maxSize/Math.max(img.width,img.height));
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL(mime,quality)); };
  img.src=dataURL; }); }

let cardFilter='全部', batchMode=false; const selSet=new Set();
function allCards(){ const o=[]; for(const g in S.cards) for(const c of S.cards[g]) o.push({...c,g}); return o; }
function addCard(g,text){ g=(g||'默认').trim()||'默认';
  if(!S.cards[g]) S.cards[g]=[];
  if(S.cards[g].some(c=>c.text===text)) return false;   // 自动去重
  S.cards[g].push({id:uid(),text,shield:false,ts:Date.now()}); save(); return true; }

function renderCards(){
  // 分组 chips
  const gs=Object.keys(S.cards);
  $('#chips').innerHTML = ['全部',...gs].map(g=>{
    const n = g==='全部'? allCards().length : S.cards[g].length;
    const sh = g!=='全部'&&S.groupshield[g];
    return `<div class="chip ${cardFilter===g?'on':''}" data-g="${esc(g)}">${sh?'🚫':''}${esc(g)} · ${n}</div>`;
  }).join('');
  $$('#chips .chip').forEach(c=>c.onclick=()=>{ cardFilter=c.dataset.g; renderCards(); });
  // 列表
  const q=($('#card-search').value||'').trim();
  let arr = cardFilter==='全部'? allCards() : S.cards[cardFilter].map(c=>({...c,g:cardFilter}));
  if(q) arr=arr.filter(c=>c.text.includes(q));
  arr.sort($('#card-sort').value==='text' ? (a,b)=>a.text.localeCompare(b.text,'zh') : (a,b)=>b.ts-a.ts);
  $('#card-list').innerHTML = arr.length? arr.map(c=>`
    <div class="card-item ${c.shield||S.groupshield[c.g]?'shielded':''}" data-id="${c.id}">
      ${batchMode?`<div class="check ${selSet.has(c.id)?'on':''}" data-sel="${c.id}">✓</div>`:''}
      <div class="ct">${esc(c.text)}<div style="font-size:10px;color:var(--sub);margin-top:4px;letter-spacing:1px">${esc(c.g)}</div></div>
      <div class="ops">
        <div class="icon-btn ${c.shield?'on':''}" data-act="shield" title="屏蔽">${c.shield?'🚫':'👁'}</div>
        <div class="icon-btn" data-act="move" title="移动">⇄</div>
        <div class="icon-btn" data-act="del" title="删除">✕</div>
      </div>
    </div>`).join('')
   : `<div class="empty">字 卡 库 是 空 的<br>点右下角添加</div>`;
  // 事件
  $$('#card-list .icon-btn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); cardAct(b.dataset.act,b.closest('.card-item').dataset.id); });
  $$('#card-list .check').forEach(c=>c.onclick=e=>{ e.stopPropagation();
    c.classList.toggle('on'); c.classList.contains('on')?selSet.add(c.dataset.sel):selSet.delete(c.dataset.sel); });
}
function findCard(id){ for(const g in S.cards){ const i=S.cards[g].findIndex(c=>c.id===id); if(i>-1) return {g,i,c:S.cards[g][i]}; } }
function cardAct(act,id){ const f=findCard(id); if(!f) return;
  if(act==='del'){ S.cards[f.g].splice(f.i,1); save(); renderCards(); }
  if(act==='shield'){ f.c.shield=!f.c.shield; save(); renderCards(); }
  if(act==='move'){ openMask(`<h3>移动到分组 <span class="x" onclick="closeMask()">✕</span></h3>
    <div class="sline">${Object.keys(S.cards).map(g=>`<button class="mini-btn" onclick="moveCard('${id}','${esc(g)}')">${esc(g)}</button>`).join('')}</div>
    <div class="sline"><input type="text" id="mv-new" placeholder="新分组名称…"><button class="mini-btn dark" onclick="moveCardNew('${id}')">新建</button></div>`); }
}
function moveCard(id,g){ const f=findCard(id); if(!f||f.g===g) {closeMask();return;}
  S.cards[f.g].splice(f.i,1); if(!S.cards[g]) S.cards[g]=[];
  if(!S.cards[g].some(c=>c.text===f.c.text)) S.cards[g].push(f.c);
  save(); closeMask(); renderCards(); }
function moveCardNew(id){ const g=$('#mv-new').value.trim(); if(g) moveCard(id,g); }
$('#card-search').oninput=renderCards;
$('#card-sort').onchange=renderCards;
$('#btn-batch').onclick=()=>{
  batchMode=!batchMode; $('#btn-batch').textContent=batchMode?'完成':'批量管理';
  if(!batchMode && selSet.size){ openMask(`<h3>已选 ${selSet.size} 张 <span class="x" onclick="closeMask()">✕</span></h3>
    <div class="sline"><button class="mini-btn" style="width:100%" onclick="batchDel()">删除所选</button></div>
    <div class="sline">${Object.keys(S.cards).map(g=>`<button class="mini-btn" onclick="batchMove('${esc(g)}')">移到${esc(g)}</button>`).join('')}</div>`); }
  if(!batchMode) selSet.clear();
  renderCards();
};
function batchDel(){ selSet.forEach(id=>{ const f=findCard(id); if(f) S.cards[f.g].splice(f.i,1); });
  selSet.clear(); save(); closeMask(); renderCards(); }
function batchMove(g){ selSet.forEach(id=>{ const f=findCard(id); if(!f) return;
  S.cards[f.g].splice(f.i,1); if(!S.cards[g]) S.cards[g]=[];
  if(!S.cards[g].some(c=>c.text===f.c.text)) S.cards[g].push(f.c); });
  selSet.clear(); save(); closeMask(); renderCards(); }

document.addEventListener('click',e=>{ if(e.target.closest('#fab')) openAddCard(); });
function openAddCard(){ openMask(`<h3>添加字卡 <span class="x" onclick="closeMask()">✕</span></h3>
  <div class="hint">单张：直接输入一行内容。<br>批量：每行一张字卡；【分组名称】 行表示以下字卡归入该分组。</div>
  <textarea id="add-text" placeholder="例如：&#10;【撒娇】&#10;你才不是呢&#10;哼，不理你了&#10;【日常】&#10;今天也有点想你"></textarea>
  <div class="sline" style="margin-top:10px">
    <select id="add-grp">${Object.keys(S.cards).map(g=>`<option>${esc(g)}</option>`).join('')}</select>
    <button class="mini-btn dark" style="flex:none" onclick="doAddCards()">添加</button>
  </div>
  <div class="sline"><button class="mini-btn" onclick="importCardsTxt()">导入 TXT</button>
  <button class="mini-btn" onclick="exportCardsTxt()">导出 TXT</button></div>
  <input type="file" id="imp-file" accept=".txt" style="display:none" onchange="impFileChange(event)">`); }
function parseBatch(text,fallbackGrp){ let g=fallbackGrp, added=0, dup=0;
  for(let line of text.split(/\r?\n/)){ line=line.trim(); if(!line) continue;
    const m=line.match(/^【(.+)】$/); if(m){ g=m[1].trim(); continue; }
    addCard(g,line)?added++:dup++; }
  return {added,dup}; }
function doAddCards(){ const t=$('#add-text').value; if(!t.trim()) return;
  const r=parseBatch(t,$('#add-grp').value);
  toast(`添加 ${r.added} 张${r.dup?`，去重 ${r.dup} 张`:''}`); closeMask(); renderCards(); }

/* 字卡库导入导出（txt，【分组】格式） */
function exportCardsTxt(){ let out='';
  for(const g in S.cards){ out+=`【${g}】\n`; for(const c of S.cards[g]) out+=c.text+'\n'; }
  download(out,'字卡库.txt'); }
function importCardsTxt(){ $('#imp-file')?$('#imp-file').click():toast('请重试'); }
function impFileChange(ev){ const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const res=parseBatch(r.result,'默认');
    toast(`导入 ${res.added} 张${res.dup?`，去重 ${res.dup} 张`:''}`); renderCards(); }; r.readAsText(f); }
function download(text,name){ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download=name; a.click(); }
</script>

function incomingCall(type){

  ui.classList.add('on','calling');
  call.ringT = setInterval(ringOnce, 1600); ringOnce();
  call.noAnsT = setTimeout(()=>{ call.missed=true; endCall(); }, rnd(16000,22000));
}
function answerCall(){
  clearTimeout(call.noAnsT); clearInterval(call.ringT);

  call.tickI=setInterval(()=>{ call.sec++;
    $('#call-stat').textContent = fmtMM(call.sec) + (call.type==='video'?' · 视频通话':'');
  },1000);

function compressImg(dataUrl, cb){
  const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas');
    const max=900; let w=img.width,h=img.height;
    if(w>max||h>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',.72)); };
  img.src=dataUrl;
}
let pvId=null;
function renderAlbum(){
  S.album=S.album||[];
  const g=$('#album-grid'); if(!g) return;
  const n=S.album.length;
  let bytes=0; S.album.forEach(p=>bytes+=(p.src||'').length);
  const mb=bytes/1024/1024;
  const st=$('#album-stats');
  if(st) st.innerHTML = n? `共 ${n} 张 · 约 ${mb.toFixed(1)} MB / 上限约 5 MB${mb>4?' · <b style="color:#c2536b">空间快满了</b>':''}` : '还没有照片，点右上角"＋添加"';
  g.innerHTML = S.album.slice().sort((a,b)=>b.ts-a.ts).map(p=>
    `<div class="album-cell" data-pid="${p.id}"><img src="${p.src}">${p.note?`<span class="album-note">${esc(p.note)}</span>`:''}</div>`).join('') || '<div style="text-align:center;color:#bbb;padding:40px 0">相册还是空的</div>';
  g.querySelectorAll('.album-cell').forEach(c=>c.onclick=()=>openPhoto(+c.dataset.pid));
}
function openPhoto(id){
  const p=S.album.find(x=>x.id===id); if(!p) return;
  pvId=id; $('#pv-img').src=p.src;
  const d=new Date(p.ts);
  $('#pv-note').textContent=p.note||'';
  $('#pv-date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  $('#photo-view').classList.add('on');

const _bindAlbum=()=>{
  const b1=$('#btn-add-photo'), inp=$('#photo-input');
  if(b1&&inp) b1.onclick=()=>inp.click();
  if(inp) inp.onchange=e=>{
    const files=[...e.target.files].slice(0,5);
    if(!files.length) return;
    let done=0;
    files.forEach(f=>{
      const r=new FileReader();
      r.onload=()=>compressImg(r.result, src=>{
        S.album.push({id:Date.now()+Math.floor(Math.random()*1e4), src, note:'', ts:Date.now()});
        save(); if(++done===files.length){ renderAlbum(); toast(`已存入 ${files.length} 张照片`); }
      });
      r.readAsDataURL(f);
    });
    e.target.value='';
  };
  const pc=$('#pv-close'); if(pc) pc.onclick=()=>$('#photo-view').classList.remove('on');
  const pd=$('#pv-del'); if(pd) pd.onclick=()=>{
    if(pvId==null||!confirm('删除这张照片？')) return;

    $('#photo-view').classList.remove('on');

  };
};

    <div class="set-item" style="display:block"><div class="lab" style="margin-bottom:10px">群员列表<small>头像按名字首字自动生成</small></div>
      <div id="mem-list"></div>
      <button class="mini-btn" style="width:100%" onclick="addMember()">＋ 添加群员</button>
    </div>
  </div>
  <div class="set-group"><div class="gt">傅 融 的 声 音（MiniMax）</div>
    <div class="set-item"><div class="lab">API Key<small>minimaxi.com 开放平台获取，只存在本机</small></div>
      <input type="text" style="width:150px" data-tts="ttsKey" placeholder="sk-..."></div>
    <div class="set-item"><div class="lab">Group ID</div>
      <input type="text" style="width:150px" data-tts="ttsGroup" placeholder="控制台查看"></div>
    <div class="set-item"><div class="lab">音色<small>推荐"青涩青年"，清冷感</small></div>
      <select style="width:120px" data-tts-voice>${TTS_VOICES.map(v=>`<option value="${v[0]}" ${S.settings.ttsVoice===v[0]?'selected':''}>${v[1]}</option>`).join('')}<option value="custom" ${S.settings.ttsVoice==='custom'?'selected':''}>克隆音色</option></select></div>
    <div class="set-item" id="ttsc-row"><div class="lab">Voice ID（克隆音色）<small>音色选"克隆音色"时生效；官方音色留空即可</small></div>
      <input type="text" style="width:150px" data-tts="ttsVoiceCustom" placeholder="粘贴你的 voice id"></div>
    <div class="set-item"><div class="lab">试听<small>合成一句验证配置</small></div>
      <button class="mini-btn" onclick="testTTS()">试听</button></div>
  </div>
  <div class="set-group"><div class="gt">通 知 · 输 入</div>
    ${sw('notify','系统通知','对方发消息时系统通知（需授权）')}
    ${txt('typingText','输入中文案','对方正在输入…')}
  </div>
  <div class="set-group"><div class="gt">消 息 管 理</div>
    <div class="set-item"><div class="lab">清空聊天记录</div>
      <button class="mini-btn" onclick="clearMsgs()">清空</button></div>
  </div>
  <div class="set-group"><div class="gt">数 据</div>
    <div class="set-item"><div class="lab">全量导出<small>设置、字卡、消息一并打包</small></div>
      <button class="mini-btn" onclick="exportAll()">导出</button></div>
    <div class="set-item"><div class="lab">全量导入</div>
      <button class="mini-btn" onclick="importAll()">导入</button></div>
    <div class="set-item"><div class="lab">重置所有数据<small>恢复出厂状态</small></div>
      <button class="mini-btn" style="border-color:#a33;color:#a33" onclick="resetAll()">重置</button></div>
    <input type="file" id="all-file" accept=".json" style="display:none" onchange="allFileChange(event)">
  </div>`;
  bindSettings();
  renderMembers();
}
let _pickWho=null;
function pickAvatar(who){ _pickWho=who;
  let inp=document.getElementById('av-file');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='av-file'; inp.accept='image/*'; inp.style.display='none';
    inp.onchange=ev=>{ const f=ev.target.files[0]; if(!f) return;
      if(f.size>2*1024*1024){ toast('图片请小于 2MB'); return; }
      const r=new FileReader(); r.onload=async ()=>{ S.profile[_pickWho+'Avatar']=await compressImage(r.result,512,'image/png'); save();
        renderSettings(); renderMsgs(); renderLoveDays(); toast('头像已更新'); }; r.readAsDataURL(f); };
    document.body.appendChild(inp); }
  inp.click(); }
function clearAvatar(who){ S.profile[who+'Avatar']=''; if(who==='me'||who==='other') S.profile[who+'HomeAvatar']='';
  save(); renderSettings(); renderMsgs(); }

function renderMembers(){ const el=$('#mem-list'); if(!el) return;
  el.innerHTML = S.settings.members.map((m,i)=>`
   <div class="member-row">${avatarHTML(m.name,i)}
    <input type="text" value="${esc(m.name)}" data-mem="${i}" style="flex:1">
    <button class="mini-btn" onclick="delMember(${i})">✕</button></div>`).join('');
  $$('#mem-list input[data-mem]').forEach(inp=>inp.onchange=()=>{ S.settings.members[+inp.dataset.mem].name=inp.value.trim()||'群员'; save(); renderMembers(); updateHeader(); });
}
function addMember(){ S.settings.members.push({name:'群员'+(S.settings.members.length+1)}); save(); renderMembers(); }
function delMember(i){ S.settings.members.splice(i,1); if(!S.settings.members.length) S.settings.members.push({name:'对方'}); save(); renderMembers(); }
function clearMsgs(){ S.msgs=[]; save(); renderMsgs(); toast('聊天记录已清空'); }
function exportAll(){ download(JSON.stringify(S,null,2),'融椿备份.json'); }
function importAll(){ $('#all-file').click(); }
function allFileChange(ev){ const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
    S=mergeData(d); save(); initAll(); toast('导入成功'); }
    catch(e){ toast('文件格式错误'); } }; r.readAsText(f); }
function resetAll(){ try{ localStorage.clear(); }catch(e){}
  try{ indexedDB.deleteDatabase('rongchun'); }catch(e){}
  setTimeout(()=>location.reload(),300); }

function bindSettings(){
  $$('#settings-body .sw').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; S.settings[k]=!S.settings[k]; el.classList.toggle('on');
    save(); if(k==='proactive') scheduleProactive(); if(k==='sound'&&S.settings.sound) playSound();
    if(k==='group') renderMsgs(); });
  $$('#settings-body [data-step]').forEach(b=>b.onclick=()=>{
    const [k,d]=b.dataset.step.split('|'); S.settings[k]=Math.max(0,S.settings[k]+ +d); save(); renderSettings(); scheduleProactive(); });
  $$('#settings-body [data-txt]').forEach(i=>i.onchange=()=>{ S.settings[i.dataset.txt]=i.value.trim(); save(); renderMsgs(); });
  $('#av-other').innerHTML = avatarHTML(S.profile.otherName,0,S.profile.otherAvatar);
  $('#av-me').innerHTML = avatarHTML(S.profile.meName,1,S.profile.meAvatar);
  $('#av-otherHome').innerHTML = avatarHTML(S.profile.otherName,2,S.profile.otherHomeAvatar||S.profile.otherAvatar);
  $('#av-meHome').innerHTML = avatarHTML(S.profile.meName,3,S.profile.meHomeAvatar||S.profile.meAvatar);
  const sdInp=$('#start-date');
  if(sdInp){ sdInp.value=S.settings.startDate||'2026-11-26';
    sdInp.onchange=()=>{ S.settings.startDate=sdInp.value; save(); renderLoveDays(); }; }
  let pdeb;
  $$('#settings-body [data-prof]').forEach(i=>{ i.value=S.profile[i.dataset.prof];
    i.addEventListener('input',()=>{ clearTimeout(pdeb); pdeb=setTimeout(()=>{
      S.profile[i.dataset.prof]=i.value.trim()||'未命名'; save();
      $('#av-other').innerHTML=avatarHTML(S.profile.otherName,0,S.profile.otherAvatar);
      $('#av-me').innerHTML=avatarHTML(S.profile.meName,1,S.profile.meAvatar);
      updateHeader(); },350); });
    i.addEventListener('change',()=>{ S.profile[i.dataset.prof]=i.value.trim()||'未命名'; save(); renderMsgs(); }); });
  $$('#settings-body [data-set]').forEach(s=>s.onchange=()=>{ S.settings[s.dataset.set]=s.value; save(); playSound(); });
  $$('#settings-body [data-tts]').forEach(i=>{ i.value=S.settings[i.dataset.tts]||'';
    i.onchange=()=>{ S.settings[i.dataset.tts]=i.value.trim(); save(); }; });
  const vSel=$('#settings-body [data-tts-voice]');
  if(vSel) vSel.onchange=()=>{ S.settings.ttsVoice=vSel.value; save(); };
}

/* ================= 外观 ================= */
function renderTheme(){
  $('#theme-body').innerHTML = `
  <div class="set-group"><div class="gt">主 题</div>
    <div class="set-item"><div class="lab">日夜模式</div>
      <div class="seg">${['light','dark','system'].map(t=>`<button data-th="${t}" class="${S.settings.theme===t?'on':''}">${{light:'日间',dark:'夜间',system:'跟随系统'}[t]}</button>`).join('')}</div></div>
    ${sw('intro','开场动画','每次进入播放黑白开场')}
  </div>
  <div class="set-group"><div class="gt">显 示</div>
    ${sw('showName','名称显示','对方/群员名称显示在气泡上方')}
    ${sw('showAvatar','头像显示')}
    ${sw('showTs','时间戳','单击消息可展开/收起时间')}
    ${sw('showRead','已读显示','文字样式，显示在消息下方')}
  </div>
  <div class="set-group"><div class="gt">字 体 与 气 泡</div>
    <div class="set-item"><div class="lab">系统字号</div><input type="range" min="12" max="22" value="${S.settings.fontSize}" data-rg="fontSize"><b style="width:34px;text-align:center">${S.settings.fontSize}</b></div>
    ${txt('fontFam','自定义字体','如：Kaiti SC','填字体的 font-family 名称，立即生效')}
    ${txt('fontUrl','字体 URL','https://…','先填此地址加载字体，再在上面的「自定义字体」填它的名称')}
    <div class="set-item" style="display:block"><div class="lab" style="margin-bottom:10px">气泡 CSS<small>选择器：.message-sent（我方）/ .message-received（对方）</small></div>
      <textarea data-ta="bubbleCSS" placeholder="可用 .message-sent / .message-received，或 .msg.me .bubble / .msg.other .bubble">${esc(S.settings.bubbleCSS)}</textarea></div>
  </div>
  <div class="set-group"><div class="gt">聊 天 背 景</div>
    <div class="set-item"><div class="lab">上传背景图</div>
      <button class="mini-btn" onclick="$('#bg-file').click()">选择图片</button></div>
    <div class="set-item"><div class="lab">移除背景</div>
      <button class="mini-btn" onclick="S.settings.chatBg='';save();applyChatBg()">移除</button></div>
    <input type="file" id="bg-file" accept="image/*" style="display:none" onchange="bgChange(event)">
  </div>`;
  $$('#theme-body .sw').forEach(el=>el.onclick=()=>{ const k=el.dataset.k;
    S.settings[k]=!S.settings[k]; el.classList.toggle('on'); save(); renderMsgs(); });
  $$('#theme-body [data-th]').forEach(b=>b.onclick=()=>{ S.settings.theme=b.dataset.th; save(); applyTheme(); renderTheme(); });
  $$('#theme-body [data-rg]').forEach(r=>r.oninput=()=>{ S.settings.fontSize=+r.value; save(); applyFontSize();
    r.nextElementSibling.textContent=r.value; });
  let deb;
  const live=(el,fn)=>{ el.addEventListener('input',()=>{ clearTimeout(deb);
    deb=setTimeout(()=>{ S.settings[el.dataset.txt||el.dataset.ta]=el.value.trim(); save(); fn();
      if(el.dataset.txt==='fontUrl' && el.value.trim() && !S.settings.fontFam) toast('已加载字体，请在「自定义字体」填它的名称'); },350); }); };
  $$('#theme-body [data-txt]').forEach(i=>live(i,applyFont));
  $$('#theme-body [data-ta]').forEach(t=>live(t,applyBubble));
}
async function bgChange(ev){ const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=async ()=>{
    S.settings.chatBg=await compressImage(r.result,1200,'image/jpeg',0.75);
    save(); applyChatBg(); toast('背景已更新'); };
  r.readAsDataURL(f); }

/* ================= 启动 ================= */
function initAll(){
  applyTheme(); applyFontSize(); applyFont(); applyBubble(); applyChatBg();
  renderMsgs(); renderSettings(); renderTheme(); renderLetters(); updateBadge();
  scheduleProactive(); checkPending();
}
function boot(){ initAll(); setInterval(checkPending, 15000);
  if(!S.settings.intro || sessionStorage.getItem('intro_done')){ $('#intro').style.display='none'; }
  else{ sessionStorage.setItem('intro_done','1'); setTimeout(()=>$('#intro').classList.add('gone'),2600); } }
function mergeData(d){ return { profile:Object.assign({},DEF.profile,d.profile),
    stickers:Object.assign({},DEF.stickers,d.stickers),
    letters:d.letters||[], pendingLetter:d.pendingLetter||null,
    settings:Object.assign({},DEF.settings,d.settings), cards:d.cards||DEF.cards,
    groupshield:d.groupshield||{}, msgs:d.msgs||[],
    weibo:d.weibo||{feed:[],hot:[],gen:0} }; }
function tsOf(raw){ try{ return (JSON.parse(raw).savedAt)||0; }catch(e){ return 0; } }
(async ()=>{
  let idbRaw=null, lsRaw=null;
  try{ idb=await idbOpen(); idbRaw=await idbGet(); }catch(e){ idb=null; }
  try{ lsRaw=localStorage.getItem('simtalk_j')||localStorage.getItem('simtalk_v1'); }catch(e){}
  let best = idbRaw;
  if(lsRaw && tsOf(lsRaw) >= tsOf(best||'')) best = lsRaw;   // 时间戳相同优先本地日志
  if(best){ try{ S = mergeData(JSON.parse(best)); }catch(e){} }
  try{ localStorage.removeItem('simtalk_v1'); }catch(e){}   // 旧版遗留清理
  flushIDB(); journal();   // 双源同步归一
  boot();
})();
</script>
</body>
</html>
